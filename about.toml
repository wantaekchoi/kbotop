# cargo-about 설정 — THIRD-PARTY.md 생성용.
#   생성: scripts/third-party.sh
#
# accepted: 실제 빌드 그래프에 들어오는 라이선스 전부. 새 의존성이 여기 없는
# 라이선스를 들고 오면 생성이 실패하므로, 의도치 않은 라이선스 유입을 잡는
# 게이트 역할도 한다(그때는 라이선스를 검토하고 여기에 추가할지 판단할 것).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "WTFPL",
]

# 실제로 배포하는 타깃만 본다. 이게 없으면 빌드하지도 않는 redox·wasi·
# windows-gnu 크레이트까지 고지에 섞여, 고지가 빌드 그래프와 맞는지 대조할 수
# 없게 된다(dist-workspace.toml의 targets와 같은 목록을 유지할 것).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# kbotop 자신도 고지에 포함된다(퍼블릭 도메인이라는 사실을 함께 싣는다).
ignore-build-dependencies = true
ignore-dev-dependencies = true

[kbotop]
accepted = ["Unlicense"]
