[package]
name = "kbotop"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Watch KBO baseball in your terminal, with strike-zone pitch tracking."
repository = "https://github.com/wantaekchoi/kbotop"
homepage = "https://github.com/wantaekchoi/kbotop"
license = "Unlicense"
readme = "README.en.md"
keywords = ["kbo", "baseball", "tui", "terminal", "scoreboard"]
categories = ["command-line-utilities"]
# crate 패키징 화이트리스트 — 내부 문서(docs/superpowers·adr·상태문서)가
# crate에 딸려 나가는 걸 차단한다(v0.1.x에서 유출됐던 리그레션 방지).
# 데모 gif는 계속 제외한다(용량).
#
# tests/와 fixture(380K)는 **포함한다.** 배포판 패키저는 crates.io 타르볼로
# 빌드하고 check 단계에서 `cargo test`를 돌리는데, 없으면 컴파일조차 안 된다
# (`#[cfg(test)]` 코드가 fixture를 include_str!로 끌어온다 — 18곳). 자기
# 테스트를 못 돌리는 crate는 검증할 방법이 없다.
include = [
    "src/**",
    "tests/**",
    "data/tips.txt",
    "data/tips.en.txt",
    "data/tips.ja.txt",
    "LICENSE",
    "README.md",
    "README.en.md",
    "CHANGELOG.md",
    "THIRD-PARTY.md",
    # 테스트가 읽는 릴리스 설정(문서·자산 정합 검사).
    "dist-workspace.toml",
    # 패키저가 고지를 스스로 재생성해 대조할 수 있게 함께 싣는다.
    "about.toml",
    "about.hbs",
    "scripts/**",
]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ureq = { version = "2.10", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
toml = "1"
directories = "6"
anyhow = "1"
thiserror = "2"
roxmltree = "0.21"

# signal-hook wraps SIGTERM/SIGHUP/SIGINT/SIGQUIT, none of which exist on
# Windows — keeping it Unix-only avoids pulling an unusable dependency into
# the Windows build. See src/main.rs::install_term_signal_handler.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
# panic = "abort"를 켜지 않는다: poller.rs의 call_source()가 catch_unwind로 소스
# 호출 패닉을 흡수해 Update::Error로 바꾸는데, abort 하에서는 catch_unwind가
# 아무것도 잡지 못하고 프로세스가 그대로 죽는다(리뷰 라운드 5). unwind 유지가
# 이 방어선이 실제 배포 바이너리에서도 동작하기 위한 전제조건이다.
